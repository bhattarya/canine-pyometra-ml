[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyo"
version = "0.1.0"
description = "Machine-learning models for treatment outcome in canine pyometra"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyo*"]

[tool.jupytext]
formats = "notebooks//ipynb,src/analysis//py:light"
