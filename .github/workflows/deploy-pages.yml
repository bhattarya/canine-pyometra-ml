name: Deploy predictor to GitHub Pages

# Primary hosting is Vercel (see frontend/vercel.json + DEPLOY.md). This workflow
# is kept as a manual fallback only — run it from the Actions tab if you want a
# GitHub Pages copy. It builds frontend/ with base=/canine-pyometra-ml/.
# `npm run build` runs the `prebuild` hook -> `sync-model`, which copies
# ../models/final_model.json into the bundle, so that file must be committed.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          PAGES_BASE: /canine-pyometra-ml/
          VITE_PROXY_URL: ${{ vars.VITE_PROXY_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
